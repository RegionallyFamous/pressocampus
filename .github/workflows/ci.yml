name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────────────

  lint:
    name: PHPCS (WordPress Coding Standards)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, cs2pr
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

  # ─── Static analysis ─────────────────────────────────────────────────────────

  analyse:
    name: PHPStan (Static Analysis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --error-format=github

  # ─── Unit tests ──────────────────────────────────────────────────────────────

  test:
    name: PHPUnit (PHP ${{ matrix.php }} / WP ${{ matrix.wp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
        wp: ['6.7', 'latest']
        exclude:
          # PHP 8.1: smoke-test on latest WP only (matches plugin minimum).
          - php: '8.1'
            wp: '6.7'
        include:
          - php: '8.3'
            wp: 'latest'
            coverage: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pressocampus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR:  /tmp/wordpress

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mysqli, pdo_mysql
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Install Subversion (needed for WP test library)
        run: sudo apt-get update -q && sudo apt-get install -y subversion

      - name: Install WordPress test suite
        run: |
          bash bin/install-wp-tests.sh \
            pressocampus_test \
            root \
            root \
            127.0.0.1 \
            ${{ matrix.wp }}
        env:
          DB_HOST: 127.0.0.1

      - name: Run tests
        run: vendor/bin/phpunit --testdox
        if: ${{ !matrix.coverage }}

      - name: Run tests with coverage
        run: |
          XDEBUG_MODE=coverage vendor/bin/phpunit \
            --coverage-clover build/coverage.xml \
            --testdox
        if: ${{ matrix.coverage }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ matrix.coverage }}
        with:
          files: build/coverage.xml
          fail_ci_if_error: false

  # ─── WordPress.org Plugin Check ──────────────────────────────────────────────

  plugin-check:
    name: Plugin Check (WordPress.org)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies (production only)
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Build clean distribution directory
        run: |
          mkdir -p /tmp/plugin-dist/pressocampus
          rsync -r --exclude-from=.buildignore . /tmp/plugin-dist/pressocampus/

      - name: WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: '/tmp/plugin-dist/pressocampus'
          # plugin_readme      — readme.txt is for WP.org listing, not runtime.
          # plugin_review_phpcs — covered by the dedicated lint job.
          exclude-checks: 'plugin_readme,plugin_review_phpcs'

  # ─── Build ───────────────────────────────────────────────────────────────────

  build:
    name: Build distributable zip
    runs-on: ubuntu-latest
    needs: [lint, analyse, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Build plugin zip
        run: bash bin/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pressocampus-zip
          path: build/pressocampus-*.zip
          retention-days: 30
